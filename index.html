<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HIS | Hospital Information System</title>
</head>

<body>

    <!-- Header -->
    <header>
        <h1>HIS</h1>
        <p>Hospital Information System</p>
    </header>


    <!-- Main Login Section -->
    <main>

        <section>
            <h2>Welcome Back</h2>
            <p>Please login to access the hospital information system.</p>

            <form>

                <div>
                    <label for="username">Username</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username"
                        placeholder="Enter your username"
                    >
                </div>

                <br>

                <div>
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password"
                        placeholder="Enter your password"
                    >
                </div>

                <br>

                <button type="submit">Login</button>

            </form>

        </section>

    </main>


    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Hospital Information System</p>
    </footer>

</body>
</html>
